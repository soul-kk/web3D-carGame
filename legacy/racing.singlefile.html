<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>卡通赛车 · Three.js Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#8fd3ff;
    font-family: ui-rounded, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-user-select:none; user-select:none; }
  canvas { display:block; }

  #hud { position:fixed; inset:0; pointer-events:none; color:#1b2430; }
  .panel {
    position:absolute; background:rgba(255,255,255,.82); border:3px solid #1b2430;
    border-radius:16px; padding:10px 14px; box-shadow:5px 5px 0 rgba(27,36,48,.85);
    backdrop-filter: blur(4px);
  }
  #left { top:18px; left:18px; min-width:170px; }
  #right { top:18px; right:18px; text-align:center; }
  .row { display:flex; justify-content:space-between; gap:14px; font-size:15px; line-height:1.7; font-weight:700; }
  .row .label { opacity:.6; font-size:13px; }
  #left .row span:last-child { font-variant-numeric: tabular-nums; }
  #minimap { display:block; border-radius:10px; background:rgba(255,255,255,.5); margin-bottom:6px; }

  #speedo {
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
    display:flex; align-items:baseline; gap:8px; color:#fff;
    text-shadow: 0 3px 0 #1b2430, -3px 0 0 #1b2430, 3px 0 0 #1b2430, 0 -3px 0 #1b2430;
    font-weight:900; letter-spacing:1px;
  }
  #speed { font-size:62px; line-height:1; font-variant-numeric: tabular-nums; }
  #speedo .unit { font-size:20px; opacity:.9; }

  #messages { position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
    font-size:120px; font-weight:900; color:#fff; text-align:center;
    text-shadow: 0 6px 0 #ff4d5a, -6px 0 0 #ff4d5a, 6px 0 0 #ff4d5a, 0 -6px 0 #ff4d5a; }
  #messages.pop { animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform:translate(-50%,-50%) scale(1.6); opacity:0 } 100% { transform:translate(-50%,-50%) scale(1); opacity:1 } }

  #warn { position:absolute; left:50%; top:16%; transform:translateX(-50%);
    background:#ff4d5a; color:#fff; font-weight:900; padding:8px 20px; border:3px solid #1b2430;
    border-radius:12px; box-shadow:4px 4px 0 rgba(27,36,48,.85); font-size:20px; }
  .hidden { display:none !important; }

  #screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(255,255,255,.35), rgba(27,36,48,.75));
    backdrop-filter: blur(3px); z-index:10; }
  .card { background:#fffdf7; border:5px solid #1b2430; border-radius:26px; padding:34px 46px;
    box-shadow:10px 10px 0 rgba(27,36,48,.9); text-align:center; max-width:560px; }
  .card h1 { font-size:42px; letter-spacing:2px; color:#ff4d5a;
    text-shadow: 3px 3px 0 #1b2430; margin-bottom:6px; }
  .card h2 { font-size:30px; color:#ff9f1c; text-shadow:2px 2px 0 #1b2430; margin-bottom:14px; }
  .card p { font-size:15px; color:#33404f; line-height:1.9; margin-bottom:8px; }
  .keys { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:14px 0 18px; }
  kbd { background:#1b2430; color:#fff; border-radius:8px; padding:5px 11px; font-size:14px; font-weight:700;
    box-shadow:0 3px 0 #000; font-family:inherit; }
  .btn { pointer-events:auto; cursor:pointer; display:inline-block; background:#ffd166; border:4px solid #1b2430;
    border-radius:14px; padding:12px 34px; font-size:20px; font-weight:900; color:#1b2430;
    box-shadow:5px 5px 0 rgba(27,36,48,.9); transition: transform .07s, box-shadow .07s; }
  .btn:hover { transform:translate(2px,2px); box-shadow:3px 3px 0 rgba(27,36,48,.9); }
  .stats { display:flex; gap:26px; justify-content:center; margin:18px 0 4px; }
  .stats div { text-align:center; }
  .stats b { display:block; font-size:26px; color:#1b2430; font-variant-numeric: tabular-nums; }
  .stats span { font-size:12px; opacity:.6; }

  #touch { position:fixed; inset:0; z-index:5; pointer-events:none; }
  .tbtn { position:absolute; width:78px; height:78px; border-radius:50%; background:rgba(255,255,255,.55);
    border:4px solid #1b2430; display:flex; align-items:center; justify-content:center;
    font-size:30px; color:#1b2430; pointer-events:auto; }
  #t-left  { left:22px;  bottom:110px; }
  #t-right { left:114px; bottom:110px; }
  #t-gas   { right:22px; bottom:110px; }
  #t-brake { right:114px; bottom:110px; }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud" class="hidden">
  <div class="panel" id="left">
    <div class="row"><span class="label">圈数</span><span id="lap">1 / 3</span></div>
    <div class="row"><span class="label">本圈</span><span id="cur">0.00</span></div>
    <div class="row"><span class="label">最佳</span><span id="best">--.--</span></div>
    <div class="row"><span class="label">总计</span><span id="total">0.00</span></div>
  </div>
  <div class="panel" id="right">
    <canvas id="minimap" width="150" height="150"></canvas>
    <div class="row"><span class="label">金币</span><span id="coins">0</span></div>
    <div class="row"><span class="label">音效 M</span><span id="sound">开</span></div>
  </div>
  <div id="speedo"><span id="speed">0</span><span class="unit">km/h</span></div>
  <div id="messages"></div>
  <div id="warn" class="hidden">↩ 逆 行 中</div>
</div>

<div id="touch" class="hidden">
  <div class="tbtn" id="t-left">◀</div>
  <div class="tbtn" id="t-right">▶</div>
  <div class="tbtn" id="t-gas">▲</div>
  <div class="tbtn" id="t-brake">▼</div>
</div>

<div id="screen">
  <div class="card" id="card">
    <h1>卡 通 赛 车</h1>
    <p>Three.js 3D 赛车 Demo</p>
    <div class="keys">
      <kbd>W ↑ 加速</kbd><kbd>S ↓ 刹车/倒车</kbd><kbd>A ← 左转</kbd><kbd>D → 右转</kbd>
    </div>
    <p>收集金币 🪙 · 躲开路障 🚧 · 冲过加速带 ⏩ · 跑完 3 圈</p>
    <p style="opacity:.6">按 <kbd>R</kbd> 回到赛道 · <kbd>M</kbd> 开关音效</p>
    <div style="height:18px"></div>
    <div class="btn" id="startBtn">开 始 比 赛</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.161.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   0. 配置
   ============================================================ */
const CFG = {
  roadWidth: 15,
  curbWidth: 1.7,
  samples: 1200,
  laps: 3,
  gravity: 26,
};
const CAR = {
  maxSpeed: 55,        // 单位/秒 (≈198 km/h)
  accel: 19,
  brake: 34,
  reverseMax: 14,
  reverseAccel: 12,
  turn: 2.05,          // rad/s
  wheelR: 0.55,
};
const ROAD_Y = 0.05;
const clamp = THREE.MathUtils.clamp;
const lerp  = THREE.MathUtils.lerp;

/* ============================================================
   1. 渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe9ff, 200, 850);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 4000);
camera.position.set(0, 8, -16);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- 卡通渐变天空 ---------- */
const sunDir = new THREE.Vector3(0.55, 0.62, 0.45).normalize();
{
  const skyMat = new THREE.ShaderMaterial({
    uniforms: {
      topColor:    { value: new THREE.Color(0x2f7fd8) },
      bottomColor: { value: new THREE.Color(0xd8f0ff) },
    },
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorld = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      uniform vec3 topColor; uniform vec3 bottomColor;
      varying vec3 vWorld;
      void main() {
        float h = normalize(vWorld).y;
        float k = pow(clamp(h * 0.5 + 0.5, 0.0, 1.0), 1.4);
        gl_FragColor = vec4(mix(bottomColor, topColor, k), 1.0);
      }`,
    side: THREE.BackSide, depthWrite: false, fog: false,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), skyMat);
  scene.add(sky);

  // 太阳
  const sun = new THREE.Mesh(
    new THREE.SphereGeometry(46, 20, 14),
    new THREE.MeshBasicMaterial({ color: 0xfff5b8, fog: false })
  );
  sun.position.copy(sunDir).multiplyScalar(1050);
  scene.add(sun);
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(90, 20, 14),
    new THREE.MeshBasicMaterial({ color: 0xfff0a0, transparent: true, opacity: 0.22, fog: false })
  );
  glow.position.copy(sun.position);
  scene.add(glow);
}

/* ---------- 光照 ---------- */
scene.add(new THREE.HemisphereLight(0xdff1ff, 0x5a8f3c, 1.05));
const sunLight = new THREE.DirectionalLight(0xfff4d6, 1.9);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
const sc = sunLight.shadow.camera;
sc.left = -70; sc.right = 70; sc.top = 70; sc.bottom = -70; sc.near = 1; sc.far = 400;
sunLight.shadow.bias = -0.0008;
scene.add(sunLight);
scene.add(sunLight.target);

/* ---------- 卡通材质工具 ---------- */
const gradientMap = (() => {
  const steps = 4;
  const data = new Uint8Array(steps);
  for (let i = 0; i < steps; i++) data[i] = Math.round(255 * Math.pow((i + 1) / steps, 0.85));
  const t = new THREE.DataTexture(data, steps, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
})();
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap, ...extra });
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x1b2430, side: THREE.BackSide });

/* ============================================================
   2. 赛道（闭合曲线）
   ============================================================ */
const TRACK_PTS = [
  [   0, -120], [  70, -110], [ 120,  -70], [ 135,  -10],
  [ 110,   45], [  55,   70], [   0,   65], [ -55,   75],
  [-115,   60], [-145,   10], [-130,  -50], [ -85,  -95], [ -35, -110],
];
const curve = new THREE.CatmullRomCurve3(
  TRACK_PTS.map(([x, z]) => new THREE.Vector3(x, 0, z)), true, 'catmullrom', 0.5
);
const N = CFG.samples;
const totalLen = curve.getLength();
const spacing = totalLen / N;

const pts = [], tans = [], nrms = [];
for (let i = 0; i < N; i++) pts.push(curve.getPointAt(i / N));
for (let i = 0; i < N; i++) {
  const a = pts[(i - 1 + N) % N], b = pts[(i + 1) % N];
  const t = new THREE.Vector3().subVectors(b, a).normalize();
  tans.push(t);
  nrms.push(new THREE.Vector3(t.z, 0, -t.x));   // 水平法线
}
const HW = CFG.roadWidth / 2;

/* ---------- 地面 ---------- */
{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), toon(0x86cf5a));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // 深浅草地色块
  const patchGeo = new THREE.CircleGeometry(1, 12);
  for (let i = 0; i < 26; i++) {
    const shade = [0x7cc44f, 0x9ade6b, 0x6fbc48][i % 3];
    const p = new THREE.Mesh(patchGeo, toon(shade));
    const a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 340;
    p.position.set(Math.cos(a) * r, 0.02, Math.sin(a) * r);
    p.rotation.x = -Math.PI / 2;
    p.scale.setScalar(25 + Math.random() * 60);
    scene.add(p);
  }
}

/* ---------- 柏油路面 ---------- */
{
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const p = pts[i % N], n = nrms[i % N];
    pos.push(p.x + n.x * HW, ROAD_Y, p.z + n.z * HW);
    pos.push(p.x - n.x * HW, ROAD_Y, p.z - n.z * HW);
    uv.push(0, i * spacing / 8, 1, i * spacing / 8);
  }
  for (let i = 0; i < N; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const road = new THREE.Mesh(g, toon(0x59627a, { side: THREE.DoubleSide }));
  road.receiveShadow = true;
  scene.add(road);
}

/* ---------- 路肩（红白条纹） ---------- */
function ribbon(innerOff, outerOff, y, colorFn) {
  const pos = [], col = [], idx = [];
  const c = new THREE.Color();
  for (let i = 0; i <= N; i++) {
    const p = pts[i % N], n = nrms[i % N];
    pos.push(p.x + n.x * innerOff, y, p.z + n.z * innerOff);
    pos.push(p.x + n.x * outerOff, y, p.z + n.z * outerOff);
    colorFn(c, i);
    col.push(c.r, c.g, c.b, c.r, c.g, c.b);
  }
  for (let i = 0; i < N; i++) {
    const a = i * 2, b = a + 1, c2 = a + 2, d = a + 3;
    idx.push(a, b, c2, b, d, c2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new THREE.Mesh(g, toon(0xffffff, { vertexColors: true, side: THREE.DoubleSide }));
}
{
  const curbColor = (c, i) => c.setHex(Math.floor(i / 7) % 2 ? 0xffffff : 0xff4d5a);
  const l = ribbon(HW, HW + CFG.curbWidth, ROAD_Y + 0.02, curbColor);
  const r = ribbon(-HW, -HW - CFG.curbWidth, ROAD_Y + 0.02, curbColor);
  l.receiveShadow = r.receiveShadow = true;
  scene.add(l, r);
}

/* ---------- 中线虚线 ---------- */
{
  const dashGeo = new THREE.BoxGeometry(0.4, 0.02, 3);
  const dashMat = toon(0xf2f4f8);
  const list = [];
  for (let d = 12; d < totalLen - 12; d += 9) list.push(d / totalLen);
  const inst = new THREE.InstancedMesh(dashGeo, dashMat, list.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
  list.forEach((t, i) => {
    const p = curve.getPointAt(t), tan = curve.getTangentAt(t);
    q.setFromUnitVectors(new THREE.Vector3(0, 0, 1), new THREE.Vector3(tan.x, 0, tan.z).normalize());
    m.compose(new THREE.Vector3(p.x, ROAD_Y + 0.02, p.z), q, new THREE.Vector3(1, 1, 1));
    inst.setMatrixAt(i, m);
  });
  scene.add(inst);
}

/* ---------- 起点 / 终点线 + 龙门架 ---------- */
{
  const cv = document.createElement('canvas');
  cv.width = 160; cv.height = 40;
  const ctx = cv.getContext('2d');
  for (let x = 0; x < 10; x++) for (let y = 0; y < 3; y++) {
    ctx.fillStyle = (x + y) % 2 ? '#ffffff' : '#1b2430';
    ctx.fillRect(x * 16, y * 14, 16, 14);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(CFG.roadWidth, 3.4),
    new THREE.MeshBasicMaterial({ map: tex })
  );
  line.rotation.x = -Math.PI / 2;
  const p0 = pts[0], t0 = tans[0];
  line.position.set(p0.x, ROAD_Y + 0.04, p0.z);
  line.rotation.z = Math.atan2(t0.x, t0.z);  // 平面绕自身法线对齐赛道方向
  scene.add(line);

  // 龙门架
  const gantry = new THREE.Group();
  const postGeo = new THREE.BoxGeometry(0.7, 10, 0.7);
  const beamGeo = new THREE.BoxGeometry(CFG.roadWidth + 5, 1.1, 0.8);
  const white = toon(0xf5f7fa), red = toon(0xff4d5a);
  for (const s of [1, -1]) {
    const post = new THREE.Mesh(postGeo, white);
    post.position.set(s * (HW + 2), 5, 0);
    post.castShadow = true;
    gantry.add(post);
  }
  const beam = new THREE.Mesh(beamGeo, red);
  beam.position.y = 10.3;
  beam.castShadow = true;
  gantry.add(beam);
  gantry.position.set(p0.x, 0, p0.z);
  gantry.rotation.y = Math.atan2(t0.x, t0.z);
  scene.add(gantry);
}

/* ---------- 树木（InstancedMesh） ---------- */
{
  const coarse = [];
  for (let i = 0; i < N; i += 8) coarse.push(pts[i]);
  const distToTrack = (x, z) => {
    let best = Infinity;
    for (const p of coarse) {
      const dx = x - p.x, dz = z - p.z;
      const d = dx * dx + dz * dz;
      if (d < best) best = d;
    }
    return Math.sqrt(best);
  };
  const spots = [];
  let guard = 0;
  while (spots.length < 260 && guard++ < 8000) {
    const a = Math.random() * Math.PI * 2, r = 90 + Math.random() * 420;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (distToTrack(x, z) > 22) spots.push({ x, z, s: 0.8 + Math.random() * 0.9, rot: Math.random() * 6.28 });
  }

  const trunkGeo = new THREE.CylinderGeometry(0.35, 0.55, 3, 6);
  trunkGeo.translate(0, 1.5, 0);
  const leaf1 = new THREE.ConeGeometry(3.0, 5.5, 7); leaf1.translate(0, 5.0, 0);
  const leaf2 = new THREE.ConeGeometry(2.2, 4.5, 7); leaf2.translate(0, 7.6, 0);

  const trunk = new THREE.InstancedMesh(trunkGeo, toon(0x8a5a34), spots.length);
  const l1 = new THREE.InstancedMesh(leaf1, toon(0x3f9142), spots.length);
  const l2 = new THREE.InstancedMesh(leaf2, toon(0x4caf50), spots.length);
  trunk.castShadow = l1.castShadow = l2.castShadow = true;

  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), col = new THREE.Color();
  spots.forEach((s, i) => {
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), s.rot);
    m.compose(new THREE.Vector3(s.x, 0, s.z), q, new THREE.Vector3(s.s, s.s * (0.9 + Math.random() * 0.4), s.s));
    trunk.setMatrixAt(i, m); l1.setMatrixAt(i, m); l2.setMatrixAt(i, m);
    col.setHSL(0.28 + Math.random() * 0.07, 0.55, 0.34 + Math.random() * 0.14);
    l1.setColorAt(i, col);
    l2.setColorAt(i, col.clone().offsetHSL(0, 0, 0.05));
  });
  scene.add(trunk, l1, l2);
}

/* ---------- 远山 ---------- */
{
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2 + Math.random() * 0.3;
    const r = 620 + Math.random() * 420;
    const h = 60 + Math.random() * 150;
    const hill = new THREE.Mesh(
      new THREE.ConeGeometry(h * (0.8 + Math.random() * 0.7), h, 7),
      toon(new THREE.Color().setHSL(0.33, 0.35, 0.42 + Math.random() * 0.08).getHex())
    );
    hill.position.set(Math.cos(a) * r, h / 2 - 6, Math.sin(a) * r);
    scene.add(hill);
  }
}

/* ---------- 云 ---------- */
const clouds = [];
{
  const puff = new THREE.SphereGeometry(1, 8, 6);
  const cloudMat = toon(0xffffff);
  for (let i = 0; i < 12; i++) {
    const g = new THREE.Group();
    const n = 3 + Math.floor(Math.random() * 3);
    for (let j = 0; j < n; j++) {
      const p = new THREE.Mesh(puff, cloudMat);
      p.position.set((j - n / 2) * 1.6 + Math.random(), Math.random() * 0.6, Math.random() * 0.8);
      p.scale.setScalar(2.2 + Math.random() * 1.8);
      g.add(p);
    }
    const a = Math.random() * Math.PI * 2, r = 150 + Math.random() * 500;
    g.position.set(Math.cos(a) * r, 70 + Math.random() * 60, Math.sin(a) * r);
    g.scale.setScalar(1.8 + Math.random() * 1.4);
    scene.add(g);
    clouds.push(g);
  }
}

/* ============================================================
   3. 道具：金币 / 锥桶 / 加速带
   ============================================================ */
const coins = [];
const coinGeo = new THREE.CylinderGeometry(0.75, 0.75, 0.16, 14);
coinGeo.rotateX(Math.PI / 2);
const coinMat = toon(0xffd166, { emissive: 0xffa000, emissiveIntensity: 0.35 });
function makeCoins() {
  for (const c of coins) scene.remove(c.mesh);
  coins.length = 0;
  for (let g = 0; g < 10; g++) {
    const t0 = Math.random() * 0.96 + 0.02;
    const off = (Math.random() * 2 - 1) * 4.2;
    for (let k = 0; k < 3; k++) {
      const t = t0 + k * 0.006;

    p.mesh.scale.multiplyScalar(1 + 1.8 * dt);
    p.mesh.material.opacity = (p.life / p.max) * 0.7;

/* ============================================================
   5. 音效
   ============================================================ */
const sound = {
  ctx: null, master: null, osc: null, gain: null, enabled: true,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.enabled ? 0.6 : 0;
    this.master.connect(this.ctx.destination);

    const filt = this.ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 1100;
    this.gain = this.ctx.createGain(); this.gain.gain.value = 0;
    this.osc = this.ctx.createOscillator();
    this.osc.type = 'sawtooth'; this.osc.frequency.value = 55;
    this.osc.connect(filt); filt.connect(this.gain); this.gain.connect(this.master);
    this.osc.start();
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  engine(speed, throttle, active) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.osc.frequency.setTargetAtTime(52 + speed * 2.6 + throttle * 14, t, 0.06);
    this.gain.gain.setTargetAtTime(active ? 0.025 + throttle * 0.03 + speed * 0.0007 : 0, t, 0.1);
  },
  blip(freq, dur, type = 'square', vol = 0.12, to = null) {
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  toggle() {
    this.enabled = !this.enabled;
    if (this.master) this.master.gain.value = this.enabled ? 0.6 : 0;
    document.getElementById('sound').textContent = this.enabled ? '开' : '关';
  },
};

const state = {
  mode: 'ready',      // ready | countdown | racing | finished
  countdown: 0,
  lap: 1,
  lapTime: 0,
  bestLap: null,
  totalTime: 0,
  coins: 0,
  prevProgress: 0,
  wrongWay: false,
  shake: 0,
  lastCount: -1,
  msgTimer: 0,
};
const car = {
  pos: new THREE.Vector3(),
  vel: new THREE.Vector2(),
  heading: 0,
  steer: 0,
  boost: 0,
  spin: 0,
  nearest: 0,
  onTrack: true,
  dustTimer: 0,
};

/* ---------- 最近赛道点 ---------- */
function nearestTrack(x, z, force = false) {
  let bestI = car.nearest, bestD = Infinity;
  const scan = (start, count) => {
    for (let k = 0; k < count; k++) {
      const i = ((start + k) % N + N) % N;
      const dx = x - pts[i].x, dz = z - pts[i].z;
      const d = dx * dx + dz * dz;
      if (d < bestD) { bestD = d; bestI = i; }
    }
  };
  if (force) scan(0, N);
  else {
    scan(car.nearest - 60, 121);
    if (bestD > 900) { bestD = Infinity; scan(0, N); }
  }
  car.nearest = bestI;
  return { idx: bestI, dist: Math.sqrt(bestD), tan: tans[bestI] };
}

/* ---------- 车辆物理 ---------- */
function updateCar(dt) {
  const near = nearestTrack(car.pos.x, car.pos.z);
  car.onTrack = near.dist < HW + 0.8;

  const fwd = new THREE.Vector2(Math.sin(car.heading), Math.cos(car.heading));
  const right = new THREE.Vector2(Math.cos(car.heading), -Math.sin(car.heading));
  let vf = car.vel.dot(fwd);
  let vr = car.vel.dot(right);

  const canDrive = state.mode === 'racing';
  const boosting = car.boost > 0;

  // 转向
  car.steer += (input.steer - car.steer) * Math.min(1, dt * 11);
  const dir = clamp(vf / 9, -1, 1);
  const steerPower = CAR.turn * (1 - 0.35 * Math.min(Math.abs(vf) / CAR.maxSpeed, 1));
  car.heading += car.steer * steerPower * dir * dt;

  // 引擎 / 刹车
  const maxSpeed = (car.onTrack ? CAR.maxSpeed : CAR.maxSpeed * 0.42) * (boosting ? 1.5 : 1);
  if (canDrive && input.throttle) {
    vf += CAR.accel * (boosting ? 2.2 : 1) * dt;
  } else if (canDrive && input.brake) {
    if (vf > 0.6) vf -= CAR.brake * dt;
    else vf -= CAR.reverseAccel * dt;
  } else {
    vf *= Math.exp(-1.1 * dt);
  }
  vf *= Math.exp(-(car.onTrack ? 0.12 : 1.7) * dt);
  vf = clamp(vf, -CAR.reverseMax, maxSpeed);

  // 侧向抓地（草地会滑）
  const grip = car.onTrack ? 7 : 2.0;
  vr *= Math.exp(-grip * dt);

  car.vel.set(fwd.x * vf + right.x * vr, fwd.y * vf + right.y * vr);
  car.pos.x += car.vel.x * dt;
  car.pos.z += car.vel.y * dt;

  // 漂移 / 出界 特效
  const speed = Math.abs(vf);
  if (canDrive && speed > 6) {
    car.dustTimer -= dt;
    const drifting = Math.abs(vr) > 5 && car.onTrack;
    if ((!car.onTrack || drifting) && car.dustTimer <= 0) {
      car.dustTimer = 0.035;
      const bx = car.pos.x - fwd.x * 1.7, bz = car.pos.z - fwd.y * 1.7;
      puff(bx + right.x * 1.1, 0.35, bz + right.y * 1.1, car.onTrack ? 0xffffff : 0xd9f5a8);
      puff(bx - right.x * 1.1, 0.35, bz - right.y * 1.1, car.onTrack ? 0xffffff : 0xd9f5a8);
    }
  }
  if (!car.onTrack && speed > 4) state.shake = Math.max(state.shake, 0.05);

  // 加速带
  if (car.boost > 0) car.boost -= dt;
  for (const pad of pads) {
    if (pad.flash > 0) pad.flash -= dt;
    if (canDrive && car.pos.distanceTo(pad.pos) < 3.6) {
      if (car.boost <= 0) {
        car.boost = 1.4;
        pad.flash = 0.4;
        sound.blip(320, 0.28, 'sawtooth', 0.1, 900);
      }
    }
    const s = 1 + Math.max(0, pad.flash) * 1.2;
    pad.mesh.scale.set(s, s, 1);
  }

  // 锥桶碰撞
  for (const c of cones) {
    if (c.knocked > 0) continue;
    const dx = c.mesh.position.x - car.pos.x, dz = c.mesh.position.z - car.pos.z;
    if (dx * dx + dz * dz < 3.2 * 3.2 && speed > 2) {
      c.knocked = 3.5;
      c.vel.set(-dx * 1.6, 5 + Math.random() * 3, -dz * 1.6);
      c.rot.set((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14);
      car.vel.multiplyScalar(0.72);
      state.shake = 0.5;
      sound.blip(160, 0.14, 'square', 0.14, 60);
      for (let i = 0; i < 4; i++) puff(c.mesh.position.x, 0.8, c.mesh.position.z, 0xffb066);
    }
  }

  // 金币
  for (const c of coins) {
    if (!c.alive) {
      if (c.dying > 0) {
        c.dying -= dt;
        c.mesh.scale.multiplyScalar(1 + 6 * dt);
        if (c.dying <= 0) c.mesh.visible = false;
      }
      continue;
    }
    c.mesh.rotation.z += dt * 3;
    c.mesh.position.y = c.base + Math.sin(performance.now() * 0.003 + c.base) * 0.18;
    if (canDrive && car.pos.distanceTo(c.mesh.position) < 2.8) {
      c.alive = false; c.dying = 0.25;
      state.coins++;
      document.getElementById('coins').textContent = state.coins;
      sound.blip(880, 0.09, 'square', 0.12, 1320);
      setTimeout(() => sound.blip(1320, 0.12, 'square', 0.1, 1760), 70);
      for (let i = 0; i < 5; i++) puff(c.mesh.position.x, c.mesh.position.y, c.mesh.position.z, 0xffe08a);
    }
  }

  // 车体姿态
  carRoot.position.set(car.pos.x, 0, car.pos.z);
  carRoot.rotation.y = car.heading;
  chassis.rotation.z = clamp(-vr * 0.012, -0.13, 0.13);
  chassis.rotation.x = clamp((input.throttle ? -0.03 : 0) + (input.brake && vf > 1 ? 0.05 : 0), -0.08, 0.08);
  if (!car.onTrack) carRoot.position.y = Math.sin(performance.now() * 0.05) * 0.03 * Math.min(speed / 20, 1);

  // 车轮
  car.spin += (vf / CAR.wheelR) * dt;
  for (const w of wheels) {
    w.tyre.rotation.x = car.spin;
    w.rim.rotation.x = car.spin;
    if (w.front) w.pivot.rotation.y = car.steer * 0.45;
  }

  return { vf, speed, near };
}

/* ---------- 圈数 / 计时 ---------- */
function updateRace(dt, near) {
  const p = near.idx / N;
  if (state.mode === 'racing') {
    state.lapTime += dt;
    state.totalTime += dt;

    if (state.prevProgress > 0.85 && p < 0.15) {
      // 完成一圈
      const t = state.lapTime;
      if (state.bestLap === null || t < state.bestLap) {
        state.bestLap = t;
        document.getElementById('best').textContent = t.toFixed(2);
        sound.blip(1200, 0.16, 'triangle', 0.12, 1800);
      }
      state.lapTime = 0;
      state.lap++;
      if (state.lap > CFG.laps) {
        state.lap = CFG.laps;
        finishRace();
      } else {
        flashMessage(`第 ${state.lap} 圈`, 64, 1.2);
        sound.blip(700, 0.12, 'square', 0.1, 1000);
      }
      document.getElementById('lap').textContent = `${state.lap} / ${CFG.laps}`;
    }
    state.prevProgress = p;
    state.wrongWay = near.tan.x * Math.sin(car.heading) + near.tan.z * Math.cos(car.heading) < -0.35
      && car.vel.length() > 4;
    document.getElementById('warn').classList.toggle('hidden', !state.wrongWay);
  }
  document.getElementById('cur').textContent = state.lapTime.toFixed(2);
  document.getElementById('total').textContent = state.totalTime.toFixed(2);
  document.getElementById('speed').textContent = Math.round(Math.abs(car.vel.length()) * 3.6);
}

/* ============================================================
   8. 相机
   ============================================================ */
const camPos = new THREE.Vector3();
const camLook = new THREE.Vector3();
function snapCamera() {
  const f = new THREE.Vector3(Math.sin(car.heading), 0, Math.cos(car.heading));
  camPos.set(car.pos.x - f.x * 11, 5.4, car.pos.z - f.z * 11);
  camLook.set(car.pos.x + f.x * 7, 1.5, car.pos.z + f.z * 7);
  camera.position.copy(camPos);
  camera.lookAt(camLook);
}
function updateCamera(dt) {
  const f = new THREE.Vector3(Math.sin(car.heading), 0, Math.cos(car.heading));
  const speed = car.vel.length();
  const dist = 10.5 + speed * 0.07;
  const height = 4.8 + speed * 0.03;
  const desired = new THREE.Vector3(car.pos.x - f.x * dist, height, car.pos.z - f.z * dist);
  camPos.lerp(desired, 1 - Math.exp(-7 * dt));
  camPos.y = Math.max(camPos.y, 1.3);

  const look = new THREE.Vector3(car.pos.x + f.x * 8, 1.4, car.pos.z + f.z * 8);
  camLook.lerp(look, 1 - Math.exp(-9 * dt));

  camera.position.copy(camPos);
  if (state.shake > 0) {
    const s = state.shake;
    camera.position.x += (Math.random() - 0.5) * s;
    camera.position.y += (Math.random() - 0.5) * s;
    camera.position.z += (Math.random() - 0.5) * s;
    state.shake = Math.max(0, state.shake - dt * 1.6);
  }
  camera.lookAt(camLook);

  const targetFov = 62 + Math.min(speed, 70) * 0.26 + (car.boost > 0 ? 7 : 0);
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 4);
  camera.updateProjectionMatrix();
}

/* 阳光跟随赛车，保证阴影清晰 */
function updateSun() {
  sunLight.position.set(
    car.pos.x + sunDir.x * 120,
    sunDir.y * 120,
    car.pos.z + sunDir.z * 120
  );
  sunLight.target.position.set(car.pos.x, 0, car.pos.z);
  sunLight.target.updateMatrixWorld();
}

/* ============================================================
   9. 小地图
   ============================================================ */
const mm = (() => {
  const cv = document.getElementById('minimap');
  const ctx = cv.getContext('2d');
  const size = cv.width, pad = 12;
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const p of pts) {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
  }
  const w = maxX - minX, h = maxZ - minZ;
  const s = (size - pad * 2) / Math.max(w, h);
  const ox = pad + ((size - pad * 2) - w * s) / 2;
  const oy = pad + ((size - pad * 2) - h * s) / 2;
  const map = (x, z) => [ox + (x - minX) * s, oy + (z - minZ) * s];

  const path = new Path2D();
  for (let i = 0; i <= N; i += 4) {
    const [x, y] = map(pts[i % N].x, pts[i % N].z);
    i === 0 ? path.moveTo(x, y) : path.lineTo(x, y);
  }
  path.closePath();
  const start = map(pts[0].x, pts[0].z);

  function draw() {
    ctx.clearRect(0, 0, size, size);
    ctx.lineJoin = ctx.lineCap = 'round';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 9;
    ctx.stroke(path);
    ctx.strokeStyle = '#59627a';
    ctx.lineWidth = 6;
    ctx.stroke(path);
    // 起点
    ctx.fillStyle = '#1b2430';
    ctx.beginPath(); ctx.arc(start[0], start[1], 3.5, 0, 6.3); ctx.fill();
    // 金币
    ctx.fillStyle = '#ffb703';
    for (const c of coins) {
      if (!c.alive) continue;
      const [x, y] = map(c.mesh.position.x, c.mesh.position.z);
      ctx.beginPath(); ctx.arc(x, y, 1.8, 0, 6.3); ctx.fill();
    }
    // 锥桶
    ctx.fillStyle = '#ff7a1a';
    for (const c of cones) {
      if (c.knocked > 0) continue;
      const [x, y] = map(c.mesh.position.x, c.mesh.position.z);
      ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
    }
    // 赛车
    const [x, y] = map(car.pos.x, car.pos.z);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.atan2(Math.sin(car.heading), Math.cos(car.heading)) * -1 + Math.PI);
    ctx.fillStyle = '#ff4d5a';
    ctx.strokeStyle = '#1b2430';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -6); ctx.lineTo(4.5, 5); ctx.lineTo(-4.5, 5);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  return { draw };
})();

/* ============================================================
   10. 流程控制
   ============================================================ */
const el = {
  hud: document.getElementById('hud'),
  screen: document.getElementById('screen'),
  card: document.getElementById('card'),
  messages: document.getElementById('messages'),
};

function flashMessage(text, size = 120, dur = 1.1) {
  el.messages.textContent = text;
  state.msgTimer = dur;
  el.messages.style.fontSize = size + 'px';
  el.messages.classList.remove('pop');
  void el.messages.offsetWidth;
  el.messages.classList.add('pop');
}

function resetCarToTrack() {
  const near = nearestTrack(car.pos.x, car.pos.z, true);
  const i = near.idx;
  car.pos.set(pts[i].x, 0, pts[i].z);
  car.heading = Math.atan2(tans[i].x, tans[i].z);
  car.vel.set(0, 0);
  car.steer = 0;
  snapCamera();
}

function resetWorld() {
  state.lap = 1;
  state.lapTime = 0;
  state.totalTime = 0;
  state.coins = 0;
  state.bestLap = null;
  state.prevProgress = 0;
  state.wrongWay = false;
  state.shake = 0;
  car.boost = 0;

  // 车子回到起点
  const i = 6;
  car.pos.set(pts[i].x, 0, pts[i].z);
  car.heading = Math.atan2(tans[i].x, tans[i].z);
  car.vel.set(0, 0);
  car.steer = 0;
  car.nearest = i;
  carRoot.position.set(car.pos.x, 0, car.pos.z);
  carRoot.rotation.y = car.heading;
  snapCamera();

  makeCoins();
  for (const c of cones) {
    c.mesh.position.copy(c.home);
    c.mesh.rotation.set(0, 0, 0);
    c.mesh.visible = true;
    c.vel.set(0, 0, 0);
    c.knocked = 0;
  }
  document.getElementById('lap').textContent = `1 / ${CFG.laps}`;
  document.getElementById('cur').textContent = '0.00';
  document.getElementById('total').textContent = '0.00';
  document.getElementById('best').textContent = '--.--';
  document.getElementById('coins').textContent = '0';
  document.getElementById('warn').classList.add('hidden');
  el.messages.textContent = '';
}

function startGame() {
  sound.init(); sound.resume();
  el.screen.classList.add('hidden');
  el.hud.classList.remove('hidden');
  resetWorld();
  state.mode = 'countdown';
  state.countdown = 3.0;
  state.lastCount = -1;
}
function restartGame() {
  el.screen.classList.add('hidden');
  el.hud.classList.remove('hidden');
  resetWorld();
  state.mode = 'countdown';
  state.countdown = 3.0;
  state.lastCount = -1;
}
function finishRace() {
  state.mode = 'finished';
  car.boost = 0;
  document.getElementById('warn').classList.add('hidden');
  sound.blip(660, 0.18, 'triangle', 0.14, 990);
  setTimeout(() => sound.blip(990, 0.35, 'triangle', 0.14, 1320), 180);
  el.card.innerHTML = `
    <h2>🏁 完 赛 !</h2>
    <div class="stats">
      <div><b>${state.totalTime.toFixed(2)}</b><span>总用时</span></div>
      <div><b>${state.bestLap !== null ? state.bestLap.toFixed(2) : '--'}</b><span>最佳单圈</span></div>
      <div><b>${state.coins}</b><span>金币</span></div>
    </div>
    <div style="height:18px"></div>
    <div class="btn" id="againBtn">再 来 一 局</div>`;
  el.screen.classList.remove('hidden');
  document.getElementById('againBtn').onclick = restartGame;
}

document.getElementById('startBtn').onclick = startGame;

/* ============================================================
   11. 主循环
   ============================================================ */
const clock = new THREE.Clock();

function updateCones(dt) {
  for (const c of cones) {
    if (c.knocked <= 0) continue;
    c.knocked -= dt;
    if (c.vel.lengthSq() > 0.01 || c.mesh.position.y > 0) {
      c.vel.y -= CFG.gravity * dt;
      c.mesh.position.addScaledVector(c.vel, dt);
      c.mesh.rotation.x += c.rot.x * dt;
      c.mesh.rotation.y += c.rot.y * dt;
      c.mesh.rotation.z += c.rot.z * dt;
      if (c.mesh.position.y <= 0) {
        c.mesh.position.y = 0;
        c.vel.y = Math.abs(c.vel.y) * 0.3;
        c.vel.x *= 0.6; c.vel.z *= 0.6;
        c.rot.multiplyScalar(0.6);
        if (c.vel.y < 0.6) { c.vel.set(0, 0, 0); c.rot.multiplyScalar(0.2); }
      }
    }
    if (c.knocked <= 0) {
      // 重生（弹回原位）
      c.mesh.position.copy(c.home);
      c.mesh.rotation.set(0, 0, 0);
      c.vel.set(0, 0, 0);
      sound.blip(520, 0.08, 'sine', 0.06);
    }
  }
}

function animate() {
  const dt = Math.min(clock.getDelta(), 0.033);
  readInput();

  // 倒计时
  if (state.mode === 'countdown') {
    state.countdown -= dt;
    const n = Math.ceil(state.countdown);
    if (n !== state.lastCount) {
      state.lastCount = n;
      if (n > 0) {
        flashMessage(String(n), 130, 0.95);
        sound.blip(520, 0.16, 'square', 0.12);
      } else {
        flashMessage('GO!', 130, 1.0);
        sound.blip(880, 0.35, 'square', 0.14, 1400);
      }
    }
    if (state.countdown <= 0) {
      state.mode = 'racing';
      state.prevProgress = car.nearest / N;
    }
  }

  // 中央提示文字自动淡出
  if (state.msgTimer > 0) {
    state.msgTimer -= dt;
    if (state.msgTimer <= 0) el.messages.textContent = '';
  }

  const { speed } = updateCar(dt);
  updateCones(dt);
  updateParticles(dt);
  updateRace(dt, { idx: car.nearest, tan: tans[car.nearest] });
  updateCamera(dt);
  updateSun();

  // 云飘动
  for (const c of clouds) {
    c.position.x += dt * 1.6;
    if (c.position.x > 700) c.position.x = -700;
  }

  sound.engine(speed, input.throttle, state.mode === 'racing' && sound.enabled);

  mm.draw();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

/* 初始化展示用的静置状态 */
resetWorld();
state.mode = 'ready';
</script>
