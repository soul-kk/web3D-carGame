<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>卡通赛车 · Three.js</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='56'%3E🏎️%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- 3D 画布挂载点 -->
  <div id="app"></div>

  <!-- ============ 游戏内 HUD ============ -->
  <div id="hud" class="hidden">
    <div id="drift-fx" aria-hidden="true"></div>
    <div class="panel" id="panel-left">
      <div class="row"><span class="label">圈数</span><span id="hud-lap">1 / 3</span></div>
      <div class="row"><span class="label">本圈</span><span id="hud-current">0.00</span></div>
      <div class="row"><span class="label">最佳</span><span id="hud-best">--.--</span></div>
      <div class="row"><span class="label">总计</span><span id="hud-total">0.00</span></div>
    </div>

    <div class="panel" id="panel-right">
      <canvas id="minimap" width="150" height="150"></canvas>
      <div class="row"><span class="label">金币</span><span id="hud-coins">0</span></div>
      <div class="row"><span class="label">幽灵</span><span id="hud-ghost">无</span></div>
      <div class="row"><span class="label">音效 M</span><span id="hud-sound">开</span></div>
    </div>

    <div id="speedo"><span id="hud-speed">0</span><span class="unit">km/h</span></div>

    <div id="nitro">
      <div id="nitro-label">按住 Shift 漂移攒氮气</div>
      <div id="nitro-bar" role="progressbar" aria-label="漂移氮气充能" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="nitro-fill"></div><div class="nitro-midline"></div>
      </div>
    </div>

    <div id="messages"></div>
    <div id="wrong-way" class="hidden">↩ 逆 行 中</div>
  </div>

  <button id="btn-pause" class="hidden" type="button" aria-label="暂停游戏">Ⅱ 暂停</button>

  <!-- ============ 移动端虚拟按键 ============ -->
  <div id="touch" class="hidden">
    <div class="tbtn" id="touch-left">◀</div>
    <div class="tbtn" id="touch-right">▶</div>
    <div class="tbtn" id="touch-gas">▲</div>
    <div class="tbtn" id="touch-brake">▼</div>
    <div class="tbtn" id="touch-drift">漂移</div>
  </div>

  <!-- ============ 世界之上的主菜单 / 弹窗 / 结算 ============ -->
  <div id="screen" class="menu-screen">
    <main class="menu" id="menu" aria-label="游戏主界面">
      <div class="menu-heading"><span class="eyebrow">TOON RACING · 01</span><h1>卡通赛车</h1><p>驶入弯道，追逐更快的自己。</p></div>
      <nav class="menu-actions" aria-label="主菜单">
        <button id="btn-start" type="button" class="menu-button primary">开始游戏 <span>↗</span></button>
        <button id="btn-help" type="button" class="menu-button">玩法说明 <span>?</span></button>
        <button type="button" class="menu-button unavailable" disabled>更换地图 <small>敬请期待</small></button>
        <button type="button" class="menu-button unavailable" disabled>更换车辆 <small>敬请期待</small></button>
        <button type="button" class="menu-button unavailable" disabled>历史成绩 <small>敬请期待</small></button>
      </nav>
      <p class="menu-record" id="record-line"></p>
      <button type="button" class="text-button" id="btn-clear">清除最佳记录</button>
    </main>
    <section id="card" class="card hidden" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"></section>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
